name: Construire EduPaie pour Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "main.py"
      - "src/**"
      - "data/edupaie.db"
      - "requirements.txt"
      - "build.bat"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Recuperer le code source
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Construire EduPaie.exe
        shell: cmd
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name EduPaie --add-data "src/database/schema.sql;src/database" --add-data "src/ui/resources/styles.qss;src/ui/resources" main.py

      - name: Preparer le dossier de distribution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/data", "dist/recus" | Out-Null
          Copy-Item "data/edupaie.db" "dist/data/edupaie.db"
          if (Test-Path "docs/manuel_utilisateur.md") {
            New-Item -ItemType Directory -Force -Path "dist/docs" | Out-Null
            Copy-Item "docs/manuel_utilisateur.md" "dist/docs/"
          }

      - name: Publier le fichier executable
        uses: actions/upload-artifact@v4
        with:
          name: EduPaie-Windows
          path: dist/
          if-no-files-found: error
          retention-days: 30
